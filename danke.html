<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vielen Dank | Amiran Gebäudereinigung</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --amiran-blau: #1E3A8A;
            --amiran-beige: #F3EFE6;
            --amiran-grau: #374151;
            --amiran-hover: #172554;
            --bg-white: #FFFFFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: var(--amiran-grau); background-color: var(--amiran-beige); line-height: 1.6; display: flex; flex-direction: column; min-height: 100vh; }
        .success-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 5%; }
        .success-icon { font-size: 5rem; color: var(--amiran-blau); margin-bottom: 20px; }
        h1 { color: var(--amiran-blau); font-size: 3rem; margin-bottom: 1rem; }
        p { font-size: 1.2rem; margin-bottom: 30px; max-width: 600px; }
        .btn-primary { background-color: var(--amiran-blau); color: var(--bg-white); padding: 16px 36px; text-decoration: none; border-radius: 6px; font-weight: bold; transition: all 0.3s ease; }
        .btn-primary:hover { background-color: var(--amiran-hover); transform: translateY(-2px); color: white; }
    </style>
</head>
<body>
    <div class="success-container">
        <i class="fa-solid fa-check-circle success-icon"></i>
        <h1>Vielen Dank!</h1>
        <p>Wir haben Ihre Anfrage erfolgreich erhalten. Unser Team wird sich schnellstmöglich mit Ihnen in Verbindung setzen.</p>
        <a href="index.html" class="btn-primary">Zurück zur Startseite</a>
    </div>
</body>
</html>
